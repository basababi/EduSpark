services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eduspark
      POSTGRES_PASSWORD: eduspark
      POSTGRES_DB: eduspark
    ports:
      - "5432:5432"
    volumes:
      - eduspark_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduspark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN}
      REFRESH_EXPIRES_MIN: ${REFRESH_EXPIRES_MIN}
      ACCESS_TOKEN_ALG: ${ACCESS_TOKEN_ALG}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./apps/web
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  eduspark_pgdata:
